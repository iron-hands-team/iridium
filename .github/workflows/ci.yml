name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DB_USER: "user"
  DB_PASSWORD: "database-password"
  JWT_SECRET_KEY: "secretkey123"
  GARAGE_RPC_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: iridium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://user:password@localhost:5432/iridium_test
      DATABASE_URL: postgresql://user:password@localhost:5432/iridium_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt -r backend/celery/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: Celery tests
        working-directory: backend/celery
        run: pytest -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev and production compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f compose.yaml -f compose.prod.yaml config -q
      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh

  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 60

      - name: Failure logs
        if: failure()
        run: docker compose logs

      - name: Finish
        if: always()
        run: docker compose down -v
